name: Release Weno Server OS

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a semantic version tag (e.g., v1.0.0)

jobs:
  release:
    name: Build and Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            binary_name: serveros-linux-amd64
          - os: darwin
            arch: amd64
            binary_name: serveros-darwin-amd64
          - os: darwin
            arch: arm64
            binary_name: serveros-darwin-arm64
          - os: windows
            arch: amd64
            binary_name: serveros-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -o ${{ matrix.binary_name }} .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.binary_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}